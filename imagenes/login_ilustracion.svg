<svg width="900" height="900" viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8FB89C"/>
      <stop offset="100%" stop-color="#6FA080"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D7A6E"/>
      <stop offset="100%" stop-color="#155C53"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F4EC"/>
      <stop offset="100%" stop-color="#E4DFCF"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#155C53" flood-opacity="0.28"/>
    </filter>
    <filter id="softSmall" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#2E322E" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="900" height="900" fill="url(#bg)"/>

  <!-- decorative soft circles -->
  <circle cx="90" cy="120" r="150" fill="#F7F4EC" opacity="0.08"/>
  <circle cx="830" cy="760" r="200" fill="#155C53" opacity="0.12"/>
  <circle cx="800" cy="140" r="70" fill="#F7F4EC" opacity="0.10"/>

  <!-- floating small coin (top left) -->
  <g filter="url(#softSmall)">
    <circle cx="200" cy="230" r="46" fill="url(#coinGrad)"/>
    <text x="200" y="243" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#1D7A6E" text-anchor="middle">$</text>
  </g>

  <!-- floating small coin (bottom right) -->
  <g filter="url(#softSmall)">
    <circle cx="700" cy="700" r="38" fill="url(#coinGrad)"/>
    <text x="700" y="711" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#1D7A6E" text-anchor="middle">$</text>
  </g>

  <!-- main card: dashboard mockup -->
  <g filter="url(#soft)">
    <rect x="185" y="330" width="530" height="360" rx="28" fill="url(#cardGrad)"/>
  </g>

  <!-- card header -->
  <text x="225" y="395" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#F7F4EC">EasyFinance</text>
  <circle cx="655" cy="385" r="7" fill="#3FA66B"/>
  <text x="672" y="391" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#CFE7DD">activo</text>

  <!-- balance -->
  <text x="225" y="450" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#B9D8CD" letter-spacing="1">UTILIDAD DEL MES</text>
  <text x="225" y="495" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#FFFFFF">$1,284.50</text>

  <!-- growth chip -->
  <rect x="225" y="512" width="120" height="30" rx="15" fill="#2E4E47"/>
  <path d="M240 526 l6 -8 l6 6 l10 -12" stroke="#7ED9A7" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="270" y="531" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#7ED9A7" text-anchor="middle">+18%</text>

  <!-- bar chart -->
  <g>
    <rect x="450" y="560" width="26" height="60" rx="6" fill="#3FA66B" opacity="0.85"/>
    <rect x="488" y="530" width="26" height="90" rx="6" fill="#3FA66B" opacity="0.9"/>
    <rect x="526" y="580" width="26" height="40" rx="6" fill="#C98A2E" opacity="0.85"/>
    <rect x="564" y="500" width="26" height="120" rx="6" fill="#3FA66B"/>
    <rect x="602" y="545" width="26" height="75" rx="6" fill="#F7F4EC" opacity="0.9"/>
  </g>

  <!-- movement rows -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="225" y="600" width="450" height="52" rx="14" fill="#155C53" opacity="0.6"/>
    <circle cx="252" cy="626" r="13" fill="#3FA66B"/>
    <text x="252" y="631" font-size="14" fill="#0F3A33" text-anchor="middle" font-weight="700">↑</text>
    <text x="278" y="622" font-size="14" fill="#F7F4EC" font-weight="600">Venta pedido #114</text>
    <text x="278" y="640" font-size="11" fill="#B9D8CD">Hoy</text>
    <text x="655" y="631" font-size="15" fill="#7ED9A7" font-weight="700" text-anchor="end">+$48.00</text>
  </g>

  <!-- title -->
  <text x="450" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" fill="#F7F4EC" text-anchor="middle">Bienvenido a</text>
  <text x="450" y="200" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#FFFFFF" text-anchor="middle">EasyFinance</text>

  <!-- tagline -->
  <text x="450" y="800" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#2E4A3D" text-anchor="middle" opacity="0.75">Control financiero simple para tu tienda online</text>
</svg>
